name: Inner Compass Deterministic Baseline 3

on:
  push:
    branches: [main]
    paths:
      - "src/safety/**"
      - "src/retrieval/**"
      - "src/validation/**"
      - "src/knowledgeBase/**"
      - "server.ts"
      - "tools/eval/**"
      - "content/knowledge-base/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/deterministic-baseline-3.yml"
  workflow_dispatch:

jobs:
  deterministic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_INNER_COMPASS_PREVIEW: "true"
      NODE_ENV: "development"
      INNER_COMPASS_BASE_URL: "http://127.0.0.1:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npm run lint

      - name: Start deterministic preview server
        run: |
          npm run dev > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run Baseline 3 deterministic regression
        run: python3 tools/eval/run_baseline_3.py

      - name: Upload Baseline 3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inner-compass-baseline-3-deterministic
          path: |
            tools/eval/results/baseline-3-deterministic/
            server.log
          if-no-files-found: warn
