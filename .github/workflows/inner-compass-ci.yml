name: Inner Compass CI

on:
  push:
    branches:
      - ai-studio/react-native-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Install Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Validate canonical knowledge base
        run: npm run validate:kb

      - name: Type-check mobile client
        run: npm run typecheck

      - name: Build Firebase Functions
        run: npm --prefix functions run build

      - name: Run Functions unit tests
        run: npm --prefix functions test

      - name: Run Firestore emulator security tests
        run: ./functions/node_modules/.bin/firebase --project demo-inner-compass emulators:exec --only firestore "npm --prefix functions run test:emulator"

      - name: Expo Doctor
        run: npx expo-doctor
