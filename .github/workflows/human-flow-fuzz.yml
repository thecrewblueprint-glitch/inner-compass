name: Inner Compass Human Flow Fuzz

on:
  push:
    branches: [main]
    paths:
      - "tools/eval/human_flow_fuzz.py"
      - ".github/workflows/human-flow-fuzz.yml"
      - "src/retrieval/**"
      - "src/safety/**"
      - "server.ts"
      - "tools/eval/fixtures/classifier-gold.json"
  workflow_dispatch:
    inputs:
      scenario_count:
        description: "Number of deterministic human-like scenarios"
        required: false
        default: "12000"
      workers:
        description: "Concurrent local HTTP workers"
        required: false
        default: "20"

jobs:
  human-flow-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_INNER_COMPASS_PREVIEW: "true"
      INNER_COMPASS_AI_MODE: "off"
      NODE_ENV: "development"
      INNER_COMPASS_BASE_URL: "http://127.0.0.1:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Enforce production AI policy
        run: python3 tools/eval/check_production_ai_policy.py

      - name: TypeScript check
        run: npm run lint

      - name: Python syntax check
        run: python3 -m py_compile tools/eval/human_flow_fuzz.py

      - name: Start deterministic preview server
        run: |
          npm run dev > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run large human-flow fuzz
        env:
          SCENARIO_COUNT: ${{ github.event.inputs.scenario_count || '12000' }}
          WORKERS: ${{ github.event.inputs.workers || '20' }}
        run: |
          python3 tools/eval/human_flow_fuzz.py --target-scenarios "$SCENARIO_COUNT" --workers "$WORKERS" --results-dir tools/eval/results/human-flow-ci --no-fail-quality

      - name: Upload flow correction map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inner-compass-human-flow-fuzz
          path: |
            tools/eval/results/human-flow-ci/
            server.log
          if-no-files-found: warn
